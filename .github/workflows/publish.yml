# Publish the spoke calculator into the FryePower website repo (GitHub Pages).
#
# On every push to main: run the tests, then copy the page files into the website repo's
# spoke-calculator/ folder, so the site serves it at fryepower.com/spoke-calculator/.
#
# One-time setup in THIS repo (Settings > Secrets and variables > Actions):
#   Variable  WEBSITE_REPO   the website repo, e.g. DubPFrye/ebike_website
#   Secret    WEBSITE_TOKEN  a fine-grained personal access token with
#                            "Contents: Read and write" on the website repo only
# Until both are set, the workflow tests but skips the publish step.
name: Publish spoke calculator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: node tests/spoke.test.js

      - name: Check publish settings
        id: cfg
        env:
          WEBSITE_REPO: ${{ vars.WEBSITE_REPO }}
          HAS_TOKEN: ${{ secrets.WEBSITE_TOKEN != '' }}
        run: |
          if [ -n "$WEBSITE_REPO" ] && [ "$HAS_TOKEN" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WEBSITE_REPO / WEBSITE_TOKEN not set: tested, not published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the website repo
        if: steps.cfg.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WEBSITE_REPO }}
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: site

      - name: Copy and push
        if: steps.cfg.outputs.publish == 'true'
        run: |
          rm -rf site/spoke-calculator
          mkdir site/spoke-calculator
          cp index.html styles.css app.js spoke.js site/spoke-calculator/
          cd site
          git config user.name "spoke-calculator-publish[bot]"
          git config user.email "spoke-calculator-publish@users.noreply.github.com"
          git add spoke-calculator
          if git diff --cached --quiet; then
            echo "spoke calculator unchanged"
          else
            git commit -m "Update spoke calculator from spoke-calculator@${GITHUB_SHA::7}"
            git push
          fi
